<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12141a" />
  <title>屎山</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="stage">
      <video
        id="scene"
        src="video/像素风格人物设计 (1).mp4"
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        aria-hidden="true"
      ></video>
      <div class="hud-layer">
        <header class="hud" aria-live="polite">
          <div class="rank-block">
            <img id="face" src="img/face.png?v=2" width="32" height="32" alt="" draggable="false" />
            <div class="rank-name" id="rank-name">初级</div>
          </div>
          <button type="button" id="clock-out" class="clock-out">收工</button>
        </header>
      </div>
    </div>
    <div class="monitor" aria-hidden="true">
      <div class="bezel">
        <div class="meters">
          <div class="meter meter-lines"><span class="lab">代码行数</span><span id="lines">0</span></div>
          <div class="meter meter-good" id="good-wrap"><span class="lab">正确</span><span id="good">0</span></div>
          <div class="meter meter-bugs" id="bugs-wrap"><span class="lab">Bug</span><span id="bugs">0</span></div>
        </div>
        <div class="screen">
          <div id="console" class="console"></div>
          <div class="scanlines"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="intro" class="overlay intro">
    <img class="intro-scene" src="assets/intro-scene.png" alt="" draggable="false" />
    <div class="intro-ui">
      <div class="intro-stack">
        <img class="intro-title" src="assets/intro-title.png" alt="SHITMOUNTAIN CODE" draggable="false" />
        <button type="button" id="intro-start" class="intro-start" aria-label="START CODING">
          <img src="assets/intro-start.png" alt="" draggable="false" />
        </button>
        <img class="intro-hint" src="assets/intro-hint.png" alt="TAP SCREEN TO FIX BUGS" draggable="false" />
      </div>
    </div>
  </div>

  <div id="sheet" class="overlay sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h2 id="sheet-title">收工</h2>
      <ul class="scoreboard">
        <li><span>职称</span><strong id="sum-rank">初级</strong></li>
        <li><span>下一级</span><strong id="sum-next">中级</strong></li>
        <li><span>屎山行数</span><strong id="sum-lines">0</strong></li>
        <li><span>正确行数</span><strong id="sum-good">0</strong></li>
        <li><span>Bug</span><strong id="sum-bugs">0</strong></li>
      </ul>
      <div id="clear-stamp" class="stamp hidden">0 BUG<br>通关</div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
  </div>

  <div id="rotate" class="rotate-hint">竖着玩</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
