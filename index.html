<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1c1e" />
  <title>屎山</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="hud" aria-live="polite">
      <div class="rank-block">
        <canvas id="face" width="48" height="48" aria-hidden="true"></canvas>
        <div class="rank-name" id="rank-name">初级</div>
      </div>
      <button type="button" id="clock-out" class="clock-out">收工</button>
    </header>
    <div class="meters">
      <div class="meter-col">
        <div class="meter meter-lines">屎山 <span id="lines">0</span></div>
        <div class="meter meter-good" id="good-wrap">正确 <span id="good">0</span></div>
      </div>
      <div class="meter meter-bugs" id="bugs-wrap">Bug <span id="bugs">0</span></div>
    </div>
    <div class="stage">
      <canvas id="scene" width="320" height="280" aria-hidden="true"></canvas>
      <div class="status" id="status">写屎山</div>
    </div>
    <div id="console" class="console" aria-hidden="true"></div>
  </div>

  <div id="intro" class="overlay intro">
    <p class="intro-copy">点屏幕改 bug</p>
  </div>

  <div id="sheet" class="overlay sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h2 id="sheet-title">收工</h2>
      <ul class="scoreboard">
        <li><span>职称</span><strong id="sum-rank">初级</strong></li>
        <li><span>下一级</span><strong id="sum-next">中级</strong></li>
        <li><span>屎山行数</span><strong id="sum-lines">0</strong></li>
        <li><span>正确行数</span><strong id="sum-good">0</strong></li>
        <li><span>Bug</span><strong id="sum-bugs">0</strong></li>
      </ul>
      <div id="clear-stamp" class="stamp hidden">0 BUG 通关</div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
  </div>

  <div id="rotate" class="rotate-hint">竖着玩</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
