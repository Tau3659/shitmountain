<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12141a" />
  <title>屎山</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preload" href="assets/intro-scene.webp" as="image" />
</head>
<body>
  <div id="app">
    <div class="stage">
      <video
        id="scene"
        src="video/scene.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="false"
        preload="auto"
        disablepictureinpicture
        aria-hidden="true"
      ></video>
      <div class="hud-layer">
        <header class="hud" aria-live="polite">
          <div class="rank-block">
            <img id="face" src="img/face.webp" width="32" height="32" alt="" draggable="false" />
            <div class="rank-name" id="rank-name">实习生</div>
          </div>
          <button type="button" id="clock-out" class="clock-out pixel-panel">收工</button>
        </header>
      </div>
    </div>
    <div class="monitor" aria-hidden="true">
      <div class="bezel">
        <div class="meters">
          <div class="meter meter-lines"><span class="lab">代码总行数</span><span id="lines">0</span></div>
          <div class="meter meter-good" id="good-wrap"><span class="lab">正确</span><span id="good">0</span></div>
          <div class="meter meter-bugs" id="bugs-wrap"><span class="lab">Bug</span><span id="bugs">0</span></div>
        </div>
        <div class="screen">
          <div id="console" class="console"></div>
          <div class="scanlines"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="intro" class="overlay intro">
    <button type="button" id="intro-settings" class="settings-btn" aria-label="设置">
      <img src="assets/settings.webp" width="40" height="40" alt="" draggable="false" />
    </button>
    <img class="intro-scene" src="assets/intro-scene.webp" alt="" draggable="false" fetchpriority="high" />
    <div class="intro-ui">
      <div class="intro-stack">
        <img class="intro-title" src="assets/intro-title.webp" alt="SHITMOUNTAIN CODE" draggable="false" />
        <button type="button" id="intro-start" class="intro-start" aria-label="开始编程">
          <span class="intro-start-label" aria-hidden="true">
            <img class="intro-start-zh" src="assets/intro-start-zh.webp" alt="" draggable="false" />
          </span>
        </button>
        <img class="intro-hint" src="assets/intro-hint.webp" alt="点击屏幕修复BUG代码" draggable="false" />
      </div>
    </div>
  </div>

  <div id="sheet" class="overlay sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h2 id="sheet-title">收工</h2>
      <ul class="scoreboard">
        <li><span>晋升需正确</span><strong id="sum-need-good">40</strong></li>
        <li><span>降级线 Bug</span><strong id="sum-need-bugs">35</strong></li>
        <li><span>代码总行数</span><strong id="sum-lines">0</strong></li>
        <li><span>正确行数</span><strong id="sum-good">0</strong></li>
        <li><span>Bug</span><strong id="sum-bugs">0</strong></li>
      </ul>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
  </div>

  <div id="rotate" class="rotate-hint">竖着玩</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
